name: Feature request
description: Describe a problem that VulnRelay should help solve.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user scenario
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or related integrations
