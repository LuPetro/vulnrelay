name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e backend
      - run: python scripts/check_release.py && python scripts/check_locks.py && python scripts/check_workflows.py && python scripts/check_secrets.py
      - run: ruff check --config backend/pyproject.toml backend scripts && pytest backend/tests --cov=vulnrelay --cov-config=backend/pyproject.toml
      - run: python -m build --no-isolation backend --outdir artifacts/python && twine check artifacts/python/*
      - run: python scripts/verify_wheel.py artifacts/python/*.whl
      - run: npm ci && npm run format:check && npm run build && npm test && npm audit --audit-level=high
        working-directory: frontend
      - run: pip-audit --disable-pip --no-deps --strict -r backend/requirements.lock --format cyclonedx-json --output artifacts/backend-sbom.cdx.json
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > ../artifacts/frontend-sbom.cdx.json
        working-directory: frontend
      - run: tar -czf artifacts/vulnrelay-ui.tar.gz -C frontend/dist .
      - run: find artifacts -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unpublished-release-candidate
          path: artifacts/
          retention-days: 14
