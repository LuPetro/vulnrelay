name: Security
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/check_secrets.py
      - run: mkdir -p artifacts && pip-audit --disable-pip --no-deps --strict -r backend/requirements.lock --format json --output artifacts/python-audit.json
      - run: pip-audit --disable-pip --no-deps --strict -r backend/requirements-dev.lock --format json --output artifacts/python-dev-audit.json
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: artifacts/python*-audit.json
          retention-days: 7
