name: Security
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1"
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - run: python scripts/check_secrets.py
      - run: mkdir -p artifacts && pip-audit --disable-pip --no-deps --strict -r backend/requirements.lock --format json --output artifacts/python-audit.json
      - run: pip-audit --disable-pip --no-deps --strict -r backend/requirements-dev.lock --format json --output artifacts/python-dev-audit.json
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: artifacts/python*-audit.json
          retention-days: 7
