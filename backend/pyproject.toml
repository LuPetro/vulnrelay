[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnrelay"
version = "0.1.0a0"
description = "Self-hosted vulnerability notification engine"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Security"]

dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "typer>=0.12,<1",
  "httpx>=0.27,<1", "python-dotenv>=1,<2"
]

[project.urls]
Repository = "https://github.com/LuPetro/vulnrelay"
Issues = "https://github.com/LuPetro/vulnrelay/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "httpx>=0.27,<1", "ruff>=0.8,<1"]
quality = ["pip-audit>=2.10,<3", "build>=1.6,<2", "twine>=6,<8", "detect-secrets==1.5.0", "pip-tools>=7.6,<8"]

[project.scripts]
vulnrelay = "vulnrelay.cli:app"

[tool.setuptools.packages.find]
include = ["vulnrelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["vulnrelay"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
