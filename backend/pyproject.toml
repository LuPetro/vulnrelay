[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnrelay"
version = "0.1.0a0"
description = "Self-hosted vulnerability notification engine"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "typer>=0.12,<1",
  "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
vulnrelay = "vulnrelay.cli:app"

[tool.setuptools.packages.find]
include = ["vulnrelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
